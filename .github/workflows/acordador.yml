# O "acordador" da Agenda: o Render free DORME depois de 15 minutos sem
# visita, e com ele morrem o relógio de lembretes e o importador de reserva
# do CodeWords (um agendamento já esperou 14 horas por causa disso).
# Um toque a cada 10 minutos, no horário do expediente, mantém o servidor
# acordado. Fora do expediente ele dorme em paz — o agendamento instantâneo
# é do webhook do Supabase, que nunca dorme.
name: acordador
on:
  schedule:
    - cron: '*/10 11-22 * * *'   # 11h-22h UTC = 8h-19h em São Paulo
  workflow_dispatch: {}

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar a Agenda no Render
        run: |
          code=$(curl -s --max-time 120 -o /dev/null -w "%{http_code}" https://indycar-agendamentos.onrender.com/api/config || echo 0)
          echo "HTTP $code"
          [ "$code" = "200" ]
