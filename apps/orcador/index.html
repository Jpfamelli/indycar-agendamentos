<!doctype html>
<html lang="pt-BR" data-tema="escuro">

    <link rel="modulepreload" crossorigin href="/orcador/assets/rota-EjIjgiBV.js">
    <link rel="modulepreload" crossorigin href="/orcador/assets/apps-C9WpbvT9.js">

    <link rel="modulepreload" crossorigin href="/orcador/assets/preload-helper-Cclj8CIH.js">
    <link rel="stylesheet" crossorigin href="/orcador/assets/index-DDbsJg6G.css">
  </head>

    <!-- Casca inicial (rodada 4): aparece no primeiro quadro, antes do JavaScript; o React troca pelo app. -->
