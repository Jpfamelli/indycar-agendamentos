<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IndyCar Tráfego</title>
  <meta name="description" content="Quanto gastou em anúncios, quantos contatos vieram e quantos viraram serviço.">
  <meta name="theme-color" content="#070a14">
  <meta name="color-scheme" content="dark light">
  <script src="tema.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icone-192.png">
  <link rel="apple-touch-icon" href="img/icone-192.png">
  <link rel="stylesheet" href="../casa/indycar.css">
  <link rel="stylesheet" href="ds/tokens.css">
  <link rel="stylesheet" href="ds/base.css">
  <link rel="stylesheet" href="ds/componentes.css">
  <link rel="stylesheet" href="css/trafego.css">
</head>
<body>
  <a class="pular" href="#miolo">Pular para o conteúdo</a>

  <header class="ic-topo">
    <a class="ic-marca" id="linkCasa" href="../" title="Voltar para a Central">
      <img src="../casa/logo.png" alt="" width="32" height="32">
      <span class="ic-nome">IndyCar <b>Tráfego</b></span>
    </a>
    <nav class="ic-abas" id="abas" aria-label="Seções"></nav>
    <div class="ic-acoes">
      <button class="botao-topo" id="bTema" type="button" aria-label="Mudar para o tema claro"></button>
      <button class="botao-topo conta" id="bConta" type="button" aria-expanded="false" aria-controls="menuConta" aria-label="Minha conta">
        <span id="contaIniciais" aria-hidden="true">?</span>
      </button>
      <div class="menu" id="menuConta" hidden></div>
    </div>
  </header>

  <div class="faixas" id="faixas"></div>

  <main class="pagina" id="miolo" tabindex="-1">
    <p class="abrindo" id="abrindo">Abrindo o Tráfego</p>
    <noscript><p class="abrindo">Esta tela precisa do JavaScript ligado no navegador.</p></noscript>
  </main>

  <div id="avisos" aria-live="polite" aria-atomic="true"></div>

  <script src="vendor/supabase.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
