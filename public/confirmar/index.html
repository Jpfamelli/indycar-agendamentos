<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Confirmar horário · IndyCar</title>
  <meta name="theme-color" content="#070a14" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png" />
  <style>
    /* Página que o CLIENTE abre pelo link do WhatsApp: uma pergunta, três botões grandes, nada de login.
       Caminhos relativos (../api) para funcionar sozinha ou sob a Central (/agenda/confirmar/). */
    :root{color-scheme:dark;--bg:#070a14;--card:#0f1424;--txt:#e9ecf4;--muted:#8a92a7;--red:#e6192e;--green:#22c55e;--orange:#f59e0b;--line:rgba(255,255,255,.08)}
    @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef0f4;--card:#fff;--txt:#191a20;--muted:#575b65;--line:rgba(0,0,0,.08)}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    main{max-width:480px;margin:0 auto;padding:28px 16px 48px}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .logo img{width:44px;height:44px;border-radius:12px}
    .logo b{font-size:20px;letter-spacing:-.3px}
    .logo b span{color:var(--red)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 18px 48px -24px rgba(0,0,0,.6)}
    h1{font-size:22px;margin:0 0 6px;line-height:1.25}
    p{margin:0 0 10px;color:var(--muted)}
    .hora{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:14px 0 18px;padding:14px;border-radius:14px;background:rgba(230,25,46,.08);border:1px solid rgba(230,25,46,.25)}
    .hora .h{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.5px;grid-row:span 2}
    .hora .d{font-weight:700}
    .hora .s{color:var(--muted);font-size:14px}
    .botoes{display:grid;gap:10px}
    button{appearance:none;border:2px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-weight:800;font-size:18px;min-height:60px;border-radius:14px;cursor:pointer;padding:0 16px;touch-action:manipulation}
    button.ok{background:var(--green);border-color:var(--green);color:#fff}
    button.nao{border-color:rgba(230,25,46,.6);color:#ff5d6c}
    button:disabled{opacity:.6;cursor:progress}
    button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
    .pronto{text-align:center;padding:10px 0 0}
    .pronto .ico{font-size:52px;line-height:1;margin-bottom:8px}
    .pronto b{font-size:20px}
    textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--txt);font:inherit;padding:10px 12px;margin:8px 0 10px}
    .erro{color:#ff5d6c;font-weight:700}
    .pe{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
    .pe em{color:var(--red);font-style:italic;font-weight:700}
    a.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;background:#25d366;color:#fff;text-decoration:none;font-weight:800;margin-top:8px}
    [hidden]{display:none!important}
    @media (prefers-reduced-motion:no-preference){.card{animation:entra .35s ease-out}@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="../logo.png" alt="" width="44" height="44" /><b>INDY<span>CAR</span></b></div>
    <div class="card" id="card" aria-live="polite">
      <h1 id="titulo">Um instante…</h1>
      <p id="texto">Buscando o seu horário.</p>
    </div>
    <p class="pe">Quem conhece, <em>Indyca!</em> 🏎 · seg–sáb, 8h às 17h30</p>
  </main>
  <script>
    (function () {
      var card = document.getElementById('card');
      var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
      var token = new URLSearchParams(location.search).get('t') || '';
      var API = new URL('../api/publico/confirmacao', location.href).href;
      var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
      function dataBR(iso) { var p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] : iso; }
      function rotuloDia(iso) {
        var d = new Date(iso + 'T12:00:00Z'); if (isNaN(d)) return '';
        var hoje = new Date(); var h = new Date(Date.UTC(hoje.getFullYear(), hoje.getMonth(), hoje.getDate(), 12));
        var n = Math.round((d - h) / 864e5);
        var sem = DIAS[d.getUTCDay()];
        return (n === 0 ? 'hoje' : n === 1 ? 'amanhã' : sem) + ', ' + dataBR(iso);
      }
      function falha(msg) {
        card.innerHTML = '<h1>Ops</h1><p class="erro">' + esc(msg) + '</p><p>Se precisar, é só chamar a oficina pelo WhatsApp.</p>';
      }
      var oficina = {};
      // "Adicionar ao calendário": um .ics gerado aqui mesmo (sem servidor), 1 h de duração
      function linkIcs(ag) {
        if (!ag.data || !ag.hora) return '';
        var d = ag.data.replace(/-/g, ''), h = ag.hora.replace(':', '');
        var fim = String(Number(ag.hora.slice(0, 2)) + 1).padStart(2, '0') + ag.hora.slice(3);
        var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//IndyCar//Agenda//PT-BR', 'BEGIN:VEVENT', 'UID:indycar-' + ag.id + '@agenda',
          'DTSTART;TZID=America/Sao_Paulo:' + d + 'T' + h + '00', 'DTEND;TZID=America/Sao_Paulo:' + d + 'T' + fim.replace(':', '') + '00',
          'SUMMARY:IndyCar · ' + String(ag.servico || 'Serviço').replace(/[,;]/g, ' '), 'LOCATION:' + String(oficina.endereco || '').replace(/[,;]/g, ' '),
          'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
        return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
      }
      function extras(ag, comCalendario) {
        var h = '';
        if (comCalendario && linkIcs(ag)) h += '<a class="wa" style="background:#3b82f6" href="' + linkIcs(ag) + '" download="indycar-horario.ics">📅 Adicionar ao calendário</a> ';
        if (oficina.mapa) h += '<a class="wa" style="background:#64748b" href="' + esc(oficina.mapa) + '" target="_blank" rel="noopener">📍 Como chegar</a> ';
        if (oficina.whatsapp) h += '<a class="wa" href="' + esc(oficina.whatsapp) + '" target="_blank" rel="noopener">💬 Falar com a oficina</a>';
        return h ? '<div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:8px">' + h + '</div>' : '';
      }
      function quando(ts) { var d = ts ? new Date(ts) : null; return d && !isNaN(d) ? ' (' + d.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', dateStyle: 'short', timeStyle: 'short' }) + ')' : ''; }
      function pronto(resposta, ag, respondidoEm) {
        var txt = resposta === 'confirmou' ? ['✅', 'Horário confirmado!', 'Te esperamos ' + rotuloDia(ag.data) + ' às ' + ag.hora + '. Qualquer coisa, é só chamar.']
          : resposta === 'remarcar' ? ['📅', 'Vamos remarcar', 'Nossa equipe já foi avisada e vai te chamar no WhatsApp para achar um horário bom pra você.']
          : ['👍', 'Tudo bem, obrigado por avisar', 'Liberamos o horário. Quando quiser voltar, é só chamar a gente.'];
        card.innerHTML = '<div class="pronto"><div class="ico">' + txt[0] + '</div><b>' + esc(txt[1]) + '</b><p>' + esc(txt[2]) + (respondidoEm ? '<br><small>Você respondeu' + esc(quando(respondidoEm)) + '.</small>' : '') + '</p>' + extras(ag, resposta === 'confirmou') + '</div>';
      }
      function tela(r) {
        var ag = r.agendamento || {};
        oficina = r.oficina || {};
        if (r.resposta) return pronto(r.resposta, ag, r.respondido_em);
        if (ag.passou || ['concluido', 'nao_fechou', 'nao_veio', 'cancelado', 'compareceu', 'em_atendimento'].indexOf(ag.status) >= 0) {
          card.innerHTML = '<h1>Esse horário já passou</h1><p>Se precisar de outro, é só chamar a oficina pelo WhatsApp.</p>' + extras(ag, false);
          return;
        }
        card.innerHTML =
          '<h1>Oi' + (ag.primeiro_nome ? ', ' + esc(ag.primeiro_nome) : '') + '! Seu horário está marcado.</h1>' +
          '<p>Confirma pra gente? Assim a equipe já deixa tudo pronto.</p>' +
          '<div class="hora"><span class="h">' + esc(ag.hora) + '</span><span class="d">' + esc(rotuloDia(ag.data)) + '</span>' +
          '<span class="s">' + esc(ag.servico || 'Serviço') + (ag.veiculo ? ' · ' + esc(ag.veiculo) : '') + '</span></div>' +
          '<div class="botoes">' +
            '<button type="button" class="ok" data-r="confirmou">✅ Confirmo, vou estar aí</button>' +
            '<button type="button" data-r="remarcar">📅 Preciso remarcar</button>' +
            '<button type="button" class="nao" data-r="nao_vem">Não vou conseguir ir</button>' +
          '</div>' +
          '<div id="obs" hidden><textarea id="obs_txt" maxlength="300" placeholder="Quer deixar um recado? (opcional)"></textarea>' +
            '<div class="botoes"><button type="button" class="ok" id="obs_ok">Enviar</button><button type="button" id="obs_volta">Voltar</button></div></div>' +
          '<p class="erro" id="erro" hidden></p>' + extras(ag, false);
        var escolha = null;
        var botoes = card.querySelectorAll('[data-r]');
        function enviar(resposta, observacao) {
          for (var i = 0; i < botoes.length; i++) botoes[i].disabled = true;
          fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ t: token, resposta: resposta, observacao: observacao || null }) })
            .then(function (x) { return x.json().then(function (j) { if (!x.ok) throw new Error(j.erro || 'Não consegui registrar.'); return j; }); })
            .then(function () { pronto(resposta, ag); })
            .catch(function (e) { document.getElementById('erro').hidden = false; document.getElementById('erro').textContent = e.message; for (var i = 0; i < botoes.length; i++) botoes[i].disabled = false; });
        }
        for (var i = 0; i < botoes.length; i++) botoes[i].addEventListener('click', function (ev) {
          var r = ev.currentTarget.getAttribute('data-r');
          if (r === 'confirmou') return enviar(r);
          escolha = r;
          document.getElementById('obs').hidden = false;
          document.querySelector('.botoes').hidden = true;
          document.getElementById('obs_txt').focus();
        });
        document.getElementById('obs_ok').addEventListener('click', function () { enviar(escolha, document.getElementById('obs_txt').value.trim()); });
        document.getElementById('obs_volta').addEventListener('click', function () { document.getElementById('obs').hidden = true; document.querySelector('.botoes').hidden = false; });
      }
      if (!token) return falha('Este link está incompleto.');
      fetch(API + '?t=' + encodeURIComponent(token))
        .then(function (x) { return x.json().then(function (j) { if (!x.ok) throw new Error(j.erro || 'Este link não vale mais.'); return j; }); })
        .then(tela)
        .catch(function (e) { falha(e.message === 'Failed to fetch' ? 'Sem conexão agora. Tente de novo em instantes.' : e.message); });
    })();
  </script>
</body>
</html>
