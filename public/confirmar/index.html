<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Confirmar horário · IndyCar</title>
  <meta name="theme-color" content="#070a14" />
  <link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png" />
  <!-- rodada 11: as fontes do padrão IndyCar (Archivo no texto, Barlow Condensed nos títulos e números), as mesmas de todos os apps -->
  <link rel="stylesheet" href="/casa/indycar.css" />
  <style>
    /* Página que o CLIENTE abre pelo link do WhatsApp: uma pergunta, três botões grandes, nada de login.
       Caminhos relativos (../api) para funcionar sozinha ou sob a Central (/agenda/confirmar/). */
    :root{color-scheme:dark;--bg:#070a14;--card:#0f1424;--txt:#e9ecf4;--muted:#8a92a7;--red:#e6192e;--red-txt:#ff7480;--green:#22c55e;--sobre-verde:#04170b;--orange:#f59e0b;--line:rgba(255,255,255,.08)}
    @media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef0f4;--card:#ffffff;--txt:#191a20;--muted:#575b65;--red-txt:#b00d22;--line:rgba(0,0,0,.08)}}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font:16px/1.5 var(--ic-texto-f,system-ui,-apple-system,"Segoe UI",sans-serif)}
    main{max-width:480px;margin:0 auto;padding:28px 16px 48px}
    .logo{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .logo img{width:40px;height:40px;border-radius:8px}
    .logo b{font:700 22px/1 var(--ic-titulo,system-ui,sans-serif);letter-spacing:.06em;text-transform:uppercase}
    .logo b span{color:var(--red);margin-left:.25em}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 18px 48px -24px rgba(0,0,0,.6)}
    h1{font:700 26px/1.1 var(--ic-titulo,system-ui,sans-serif);text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
    p{margin:0 0 10px;color:var(--muted)}
    .hora{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin:14px 0 18px;padding:14px;border-radius:14px;background:rgba(230,25,46,.08);border:1px solid rgba(230,25,46,.25)}
    .hora .h{font:700 44px/1 var(--ic-titulo,system-ui,sans-serif);font-variant-numeric:tabular-nums;grid-row:span 2}
    .hora .d{font-weight:700}
    .hora .s{color:var(--muted);font-size:14px}
    .botoes{display:grid;gap:10px}
    button{appearance:none;border:2px solid var(--line);background:transparent;color:var(--txt);font:inherit;font-weight:800;font-size:18px;min-height:60px;border-radius:14px;cursor:pointer;padding:0 16px;touch-action:manipulation}
    button.ok{background:var(--green);border-color:var(--green);color:var(--sobre-verde)}
    button.nao{border-color:rgba(230,25,46,.6);color:var(--red-txt)}
    button:disabled{opacity:.6;cursor:progress}
    button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
    .pronto{text-align:center;padding:10px 0 0}
    .pronto .ico{font-size:52px;line-height:1;margin-bottom:8px}
    .pronto b{font-size:20px}
    textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--txt);font:inherit;padding:10px 12px;margin:8px 0 10px}
    .erro{color:var(--red-txt);font-weight:700}
    .pe{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
    .pe em{color:var(--red-txt);font-style:italic;font-weight:700}
    a.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;background:#25d366;color:var(--sobre-verde);text-decoration:none;font-weight:800;margin-top:8px}
    a.wa.cal{background:#1d4ed8;color:#fff} a.wa.mapa{background:#475569;color:#fff}
    a.wa:focus-visible{outline:3px solid var(--red);outline-offset:2px}
    [hidden]{display:none!important}
    @media (prefers-reduced-motion:no-preference){.card{animation:entra .35s ease-out}@keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <div class="logo"><img src="../logo.png" alt="" width="40" height="40" /><b>IndyCar<span>Agenda</span></b></div>
    <div class="card" id="card" aria-live="polite">
      <h1 id="titulo">Um instante…</h1>
      <p id="texto">Buscando o seu horário.</p>
    </div>
    <p class="pe">Quem conhece, <em>Indyca!</em> 🏎 · segunda a sábado, 8h às 17h30</p>
  </main>
  <script src="./confirmar.js"></script>
</body>
</html>
