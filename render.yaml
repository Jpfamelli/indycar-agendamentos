# Deploy no Render (https://render.com) — conecte este repositório e o Render lê este arquivo.
services:
  - type: web
    name: indycar-agendamentos
    runtime: node
    # Os dados agora ficam no Supabase: não é mais preciso disco persistente.
    plan: starter
    buildCommand: npm install # supabase-js e o SDK da Anthropic (CRM e Atendimento)
    # IndyCar Central (16/10): Agenda + CRM + Comunicar + Atendimento num servidor só.
    # Rodada 8 (19/11): o Tráfego (apps/trafego) também mora aqui, em /trafego/. Mesmo serviço, mesmo build.
    # Rollback: voltar para "node server.js" (só a Agenda) no painel ou pela API do Render.
    startCommand: node central.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      # ---- Banco: Supabase (PostgREST) ----
      - key: SUPABASE_URL
        value: https://nppfqhavqahapmugnyng.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false           # cole a chave service_role no painel (SEGREDO)
      # O espelho local->cloud perde o sentido com os dois lados no mesmo banco
      - key: MIRROR_DISABLED
        value: "1"
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false           # defina no painel (segredo)
      # ---- Integração CodeWords (workflows do IndyCar) ----
      - key: CW_API_KEY
        sync: false           # cole a chave cwk-... no painel (segredo)
      - key: CW_SERVICE_ID
        value: indycar_carlos_whatsapp_e3cd01d3      # atendente Carlos
      - key: CW_DB_SERVICE_ID
        value: indycar_agendamentos_db_6657a75c      # banco de agendamentos
      - key: CW_NOSHOW_SERVICE_ID
        value: indycar_noshow_notifier_09b5cd69      # notificação de ausência
      - key: CW_CONNECT_SERVICE_ID
        value: whatsapp_device_manager               # conexão por QR
      # CW_DEVICE_ID é opcional — o app cria um device válido sozinho se faltar
      - key: ANTHROPIC_API_KEY
        sync: false           # opcional, só se usar o motor Claude
    # (bloco "disk" removido: o banco saiu do arquivo SQLite e foi para o Supabase)
# Central: além do env group "Indycar" (SUPABASE_*, ANTHROPIC_API_KEY, CW_*), o serviço tem
# RUNNER_TOKEN (carteiro do Comunicar; igual a posvenda_config.runner_token), ICS_TOKEN,
# IMPORT_INTERVALO_MIN e WHATSAPP_VERIFY_TOKEN — valores só no painel do Render.
# Tráfego (rodada 8): usa as mesmas SUPABASE_* e ANTHROPIC_API_KEY e não pede variável nova para subir.
# As rotinas dele (coleta, radar, relatório, avisos) ficam DESLIGADAS; só ligam com TRAFEGO_AUTOMATICO=1 no painel
# (ADS_AUTOMATICO não manda na Central). ADS_CRON_TOKEN só é preciso se um agendador de fora for chamar
# /trafego/api/cron/*; sem ele essas rotas respondem 401. Não criar ADS_DEMO nem ADS_DEMO_ENVIA.
# A lista completa está em indycar-ferramentas/RENDER.md (seção de 19/11/2026).
